name: SEO availability monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test monitor failure detection
        run: npm run test:seo-monitor

      - name: Check public SEO routes
        env:
          SEO_BASE_URL: ${{ vars.SEO_BASE_URL || 'https://gamexs.ir' }}
          SEO_MONITOR_GAME_SLUG: ${{ vars.SEO_MONITOR_GAME_SLUG }}
          SEO_MONITOR_PUBLISHER_SLUG: ${{ vars.SEO_MONITOR_PUBLISHER_SLUG }}
          SEO_MONITOR_GENRE_SLUG: ${{ vars.SEO_MONITOR_GENRE_SLUG }}
          SEO_MONITOR_PS_PLUS_TIER: ${{ vars.SEO_MONITOR_PS_PLUS_TIER }}
          SEO_MONITOR_PURCHASE_TYPE: ${{ vars.SEO_MONITOR_PURCHASE_TYPE }}
          SEO_MONITOR_CONCURRENCY: '2'
          SEO_ALERT_WEBHOOK: ${{ secrets.SEO_ALERT_WEBHOOK }}
        run: node ops/seo-monitor.mjs
